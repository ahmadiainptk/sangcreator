  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://generativelanguage.googleapis.com">
  
  <style>
    /* ===== SAME STYLES AS PREVIOUS VERSION ===== */
    /* (Copy semua style dari versi sebelumnya) */
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #12172b;
      --muted: #5f6b85;
      --line: #e3e8f2;
      --accent: #5b4bd6;
      --accent-2: #f5a623;
      --accent-soft: #efecff;
      --side: #141a2e;
      --side-ink: #c9d2e8;
      --side-line: #26304c;
      --ok: #17a673;
      --danger: #e04f5f;
      --code-bg: #0f1424;
      --code-ink: #dfe6ff;
      --shadow: 0 6px 24px rgba(19,25,55,.07);
      --radius: 14px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    html[data-theme="dark"] {
      --bg: #0d1120;
      --card: #151b2e;
      --ink: #e9edf8;
      --muted: #98a3bd;
      --line: #242d47;
      --accent: #8b7cff;
      --accent-2: #ffbe4d;
      --accent-soft: #232145;
      --side: #0a0e1a;
      --side-ink: #aab6d2;
      --side-line: #1d2540;
      --code-bg: #080c17;
      --shadow: 0 6px 24px rgba(0,0,0,.35);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.55;
      transition: background .25s, color .25s;
    }
    
    /* ===== LAYOUT ===== */
    /* ===== LAYOUT: HEADER + MAIN ===== */
    .hdr {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 14px;
      padding: 12px 20px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .hdr-brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
    .logo {
      width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; color: #fff;
    }
    .hdr-brand .t span { font-size: 10px; color: var(--muted); letter-spacing: 1.4px; font-weight: 700; display: block; }
    .hdr-brand .t b { font-size: 15px; font-weight: 800; display: block; }
    .hdr-right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
    .hdr-theme {
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      width: 38px; height: 38px; border-radius: 11px; font-size: 17px; cursor: pointer;
    }
    .api-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 12px 20px;
      background: var(--accent-soft);
      border-bottom: 1px dashed var(--accent);
    }
    .api-bar-label { font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .api-bar input {
      flex: 1; min-width: 200px; width: auto; padding: 9px 12px;
      border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink);
      font-size: 13px; font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .api-bar-btn {
      border: 0; border-radius: 9px; padding: 9px 18px; font-size: 13px; font-weight: 700;
      cursor: pointer; background: linear-gradient(135deg, var(--accent), #7a5cf0); color: #fff; font-family: inherit;
    }
    .api-bar-link { font-size: 12px; color: var(--accent); text-decoration: none; white-space: nowrap; }
    .api-bar-note { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .main { width: 100%; padding: 20px 20px 80px; }
    .inner { max-width: 960px; margin: 0 auto; }
    
    /* ===== SIDE BRAND ===== */
    .side-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 16px;
      border-bottom: 1px solid var(--side-line);
      margin-bottom: 12px;
    }
    .side-brand .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      flex: 0 0 auto;
    }
    .side-brand .bn { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: .4px; line-height: 1.2; }
    .side-brand .bs { font-size: 10.5px; color: #7b88a8; }
    
    /* ===== NAVIGATION ===== */
    .nav-label {
      font-size: 9.5px;
      letter-spacing: 1.8px;
      color: #5d6a90;
      font-weight: 800;
      padding: 14px 8px 6px;
      text-transform: uppercase;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 11px;
      cursor: pointer;
      color: var(--side-ink);
      transition: .14s;
      border: 1px solid transparent;
    }
    .nav:hover { background: rgba(255,255,255,.05); }
    .nav.on {
      background: linear-gradient(135deg, rgba(139,124,255,.24), rgba(245,166,35,.12));
      border-color: rgba(139,124,255,.45);
      color: #fff;
    }
    .nav .ic { font-size: 17px; line-height: 1.25; flex: 0 0 auto; width: 22px; text-align: center; }
    .nav .tx { flex: 1; min-width: 0; }
    .nav .tx b { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: -.1px; }
    .nav .tx span { display: block; font-size: 10px; color: #7f8cad; line-height: 1.3; margin-top: 1px; }
    .nav.on .tx span { color: #b9c2dd; }
    .badge-n {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .5px;
      padding: 2px 8px;
      border-radius: 6px;
      flex: 0 0 auto;
    }
    .badge-free { background: rgba(23,166,115,.22); color: #4ade9b; border: 1px solid rgba(23,166,115,.5); }
    .badge-pro { background: rgba(245,166,35,.18); color: #f5c069; border: 1px solid rgba(245,166,35,.45); }
    
    /* ===== SIDE FOOTER ===== */
    .side-foot {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--side-line);
      font-size: 10px;
      color: #5d6a90;
      text-align: center;
      line-height: 1.6;
    }
    .side-theme {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,.06);
      border: 0;
      color: var(--side-ink);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      font-family: inherit;
    }
    
    /* ===== API STATUS ===== */
    .api-status {
      background: rgba(23,166,115,.15);
      border: 1px solid rgba(23,166,115,.3);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #7b88a8;
      text-align: center;
    }
    .api-status.ok { border-color: var(--ok); color: var(--ok); }
    .api-status.err { border-color: var(--danger); color: var(--danger); }
    .api-status .key { font-family: monospace; font-size: 10px; color: var(--accent); }
    
    .api-key-box {
      margin-bottom: 12px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--side-line);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .api-key-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .3px;
      color: #9fb0d4;
    }
    .api-key-box input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--side-line);
      border-radius: 8px;
      background: var(--side);
      color: var(--side-ink);
      font-size: 11.5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .api-key-box input:focus { outline: 1px solid var(--accent); border-color: transparent; }
    .api-key-btn {
      border: 0;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #7a5cf0);
      color: #fff;
      font-family: inherit;
    }
    .api-key-btn:active { transform: scale(.97); }
    .api-key-hint {
      font-size: 9.5px;
      color: #5d6a90;
      line-height: 1.5;
    }
    .api-key-hint a { color: var(--accent); text-decoration: none; }
    
    /* ===== MAIN CONTENT ===== */
    .topbar { margin-bottom: 6px; }
    .brand {
      display: inline-block;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2.4px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.4px; }
    .sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
    .pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .6px;
      padding: 3px 10px;
      border-radius: 99px;
      margin-bottom: 6px;
    }
    .pill-free { background: rgba(23,166,115,.15); color: #0e9668; border: 1px solid rgba(23,166,115,.4); }
    .pill-pro { background: rgba(245,166,35,.16); color: #b87708; border: 1px solid rgba(245,166,35,.45); }
    html[data-theme="dark"] .pill-free { color: #5fe0a8; }
    html[data-theme="dark"] .pill-pro { color: #f5c069; }
    
    /* ===== CARDS ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-top: 14px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--accent);
      margin: 0 0 12px;
    }
    .card h2 .lite {
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted);
      font-weight: 400;
    }
    .fsec {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }
    .fsec:first-child { margin-top: 0; }
    
    /* ===== FORM ===== */
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin: 0 0 5px;
      color: var(--muted);
    }
    .hint {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      transition: .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: transparent;
    }
    textarea { resize: vertical; min-height: 70px; }
    .field { margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media(max-width: 620px) { .row, .row3 { grid-template-columns: 1fr; } }
    
    /* ===== BUTTONS ===== */
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform .09s, background .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn-main {
      background: linear-gradient(135deg, var(--accent), #7a5cf0);
      color: #fff;
      width: 100%;
      margin-top: 4px;
      box-shadow: 0 4px 14px rgba(91,75,214,.32);
    }
    .btn-ghost {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
    }
    .btn-add {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px dashed var(--accent);
      width: 100%;
      font-size: 13.5px;
      padding: 11px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn-row .btn { flex: 1; min-width: 118px; }
    .btn-ide {
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .btn-ide:active { transform: scale(.96); }
    
    /* ===== CHIPS ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 12.5px;
      cursor: pointer;
      user-select: none;
      transition: .15s;
    }
    .chip.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .chip:active { transform: scale(.985); }
    
    /* ===== SWITCH ===== */
    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--bg);
      cursor: pointer;
      margin-bottom: 11px;
    }
    .switch input { width: auto; margin: 0; accent-color: var(--accent); transform: scale(1.15); }
    .switch span { font-size: 13.5px; font-weight: 600; color: var(--ink); }
    
    /* ===== OUTPUT ===== */
    .out-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 12px;
      flex-wrap: wrap;
    }
    .out-head h3 { font-size: 15px; margin: 0; flex: 1; }
    .badge {
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 700;
    }
    .block {
      background: var(--code-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .block pre {
      margin: 0;
      color: var(--code-ink);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12.8px;
      line-height: 1.62;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .block-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .block-title {
      color: #8ea0d0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy {
      background: rgba(255,255,255,.09);
      color: #dfe6ff;
      border: 0;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      flex: 0 0 auto;
      transition: .15s;
    }
    .copy.done { background: var(--ok); color: #fff; }
    .copy:active { transform: scale(.97); }
    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      padding: 30px 14px;
    }
    
    /* ===== VIEWS ===== */
    .view { display: none; }
    .view.on { display: block; animation: masuk .18s ease-out; }
    @keyframes masuk {
      from { opacity: 0; transform: translate3d(0, 8px, 0); }
      to { opacity: 1; transform: none; }
    }
    
    /* ===== TOAST ===== */
    #toastWrap {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: max-content;
      max-width: 92vw;
    }
    .toast {
      background: #1b2136;
      color: #fff;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 26px rgba(0,0,0,.28);
      display: flex;
      align-items: center;
      gap: 9px;
      animation: toastIn .22s cubic-bezier(.2,.9,.3,1.3);
      border: 1px solid rgba(255,255,255,.09);
      max-width: 100%;
    }
    .toast.keluar { animation: toastOut .2s ease-in forwards; }
    .toast.ok { background: #0f8f63; }
    .toast.err { background: #c0394b; }
    .toast.info { background: #3b3486; }
    @keyframes toastIn {
      from { opacity: 0; transform: translate3d(0, 14px, 0) scale(.96); }
      to { opacity: 1; transform: none; }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translate3d(0, 10px, 0) scale(.97); }
    }
    
    /* ===== SCROLL TO TOP ===== */
    #keAtas {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 90;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(19,25,55,.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      transform: translate3d(0, 8px, 0);
    }
    #keAtas.on { opacity: 1; pointer-events: auto; transform: none; }
    
    /* ===== RESPONSIVE ===== */
    @media(max-width: 880px) {
      .hdr { padding: 10px 14px; }
      .api-bar { padding: 10px 14px; }
      .api-bar-note { display: none; }
      .main { padding: 14px 14px 60px; }
      #keAtas { bottom: 18px; right: 14px; }
    }
    
    /* ===== MOBILE COMPACT (< 620px) ===== */
    @media(max-width: 620px) {
      .hdr { padding: 8px 12px; gap: 10px; }
      .logo { width: 34px; height: 34px; font-size: 15px; border-radius: 9px; }
      .hdr-brand .t b { font-size: 13.5px; }
      .hdr-brand .t span { font-size: 9px; }
      .api-bar { padding: 8px 12px; gap: 7px; }
      .api-bar-label { font-size: 12px; }
      .api-bar-link { display: none; }
      .api-bar input { min-width: 120px; padding: 8px 10px; }
      .card { padding: 14px; }
      .card h2 { margin-bottom: 10px; }
      input, select, textarea { padding: 9px 11px; font-size: 15px; }
      textarea { min-height: 60px; }
      .field { margin-bottom: 11px; }
      .fsec { margin: 13px 0 8px; }
      .main { padding: 12px 12px 70px; }
      .btn { padding: 12px 16px; font-size: 14.5px; }
      .btn-ghost { padding: 9px 14px; }
      .inner { max-width: 100%; }
      .outp-chip { padding: 7px 11px; font-size: 12px; }
    }
    
    /* ===== MATERI ===== */
    .materi {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      background: var(--bg);
    }
    .materi-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .materi-no {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 auto;
    }
    .materi-label {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      overflow: hidden;

<script>
// ================================================================
// 1. KONFIGURASI GEMINI API
// ================================================================

// === KONFIGURASI API KEY ===
// API key disimpan di localStorage (dapat diinput dari halaman web, tanpa edit kode).
// Cara mendapatkan key: https://aistudio.google.com/app/apikey
const GEMINI_MODEL = 'gemini-2.5-flash'; // model default (stabil & hemat). Alternatif: 'gemini-2.5-pro', 'gemini-3.7-flash', 'gemini-3.5-flash'

// Baca API key dari localStorage; fallback ke placeholder jika belum ada.
let GEMINI_API_KEY = localStorage.getItem('sangcreator_gemini_key') || '';

// Endpoint API Gemini (dibangun ulang setiap kali key berubah)
let GEMINI_URL = buildGeminiUrl();

function buildGeminiUrl() {
  return `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${GEMINI_API_KEY}`;
}

// Simpan key baru ke localStorage dan perbarui endpoint
function setApiKey(key) {
  GEMINI_API_KEY = key.trim();
  GEMINI_URL = buildGeminiUrl();
  localStorage.setItem('sangcreator_gemini_key', GEMINI_API_KEY);
}

// ================================================================
// 2. STATE
// ================================================================

let API_READY = false;
let PREMIUM = true; // Semua tools terbuka

// ================================================================
// 3. TOAST SYSTEM
// ================================================================

let _toastAntri = [];
let _toastIdCounter = 0;

function toast(pesan, tipe, ms) {
  const w = document.getElementById('toastWrap');
  if (!w) return;
  const t = document.createElement('div');
  const id = ++_toastIdCounter;
  t.className = 'toast ' + (tipe || 'info');
  t.textContent = pesan;
  t.dataset.toastId = id;
  w.appendChild(t);
  _toastAntri.push(t);
  if (_toastAntri.length > 3) { const x = _toastAntri.shift(); x.remove(); }
  if (ms && ms > 0) {
    setTimeout(() => {
      t.classList.add('keluar');
      setTimeout(() => { t.remove(); _toastAntri = _toastAntri.filter(z => z !== t); }, 220);
    }, ms);
  }
  return id;
}

function closeToast(id) {
  const t = _toastAntri.find(el => parseInt(el.dataset.toastId) === id);
  if (t) {
    t.classList.add('keluar');
    setTimeout(() => { t.remove(); _toastAntri = _toastAntri.filter(z => z !== t); }, 220);
  }
}

// ================================================================
// 4. UTILITY FUNCTIONS
// ================================================================

const $ = id => document.getElementById(id);

function P() { return []; }

function salin(text, btn) {
  const done = () => {
    if (!btn.dataset.old) btn.dataset.old = btn.textContent;
    btn.textContent = '✓ Tersalin';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = btn.dataset.old; btn.classList.remove('done'); }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => { done(); toast('Prompt tersalin', 'ok'); })
      .catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); toast('Prompt tersalin', 'ok'); } 
  catch(e) { toast('Gagal menyalin', 'err', 3200); }
  document.body.removeChild(ta);
}

function blok(title, text) {
  const w = document.createElement('div');
  w.className = 'block';
  const bar = document.createElement('div');
  bar.className = 'block-bar';
  const t = document.createElement('div');
  t.className = 'block-title';
  t.textContent = title;
  const b = document.createElement('button');
  b.className = 'copy';
  b.textContent = 'Salin';
  b.onclick = () => salin(text, b);
  bar.appendChild(t);
  bar.appendChild(b);
  const p = document.createElement('pre');
  p.textContent = text;
  w.appendChild(bar);
  w.appendChild(p);
  return w;
}

// Blok hasil dengan tombol "Generate AI" — hasil Gemini tampil di bawah prompt
function blokAI(title, text) {
  const w = document.createElement('div');
  w.className = 'block';
  const bar = document.createElement('div');
  bar.className = 'block-bar';
  const t = document.createElement('div');
  t.className = 'block-title';
  t.textContent = title;
  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy';
  copyBtn.textContent = 'Salin';
  copyBtn.onclick = () => salin(text, copyBtn);
  const aiBtn = document.createElement('button');
  aiBtn.className = 'ai-btn';
  aiBtn.textContent = '✨ Generate AI';
  bar.appendChild(t);
  bar.appendChild(copyBtn);
  bar.appendChild(aiBtn);
  const p = document.createElement('pre');
  p.textContent = text;
  w.appendChild(bar);
  w.appendChild(p);

  // Area hasil AI (kosong sampai diklik)
  const aiOut = document.createElement('div');
  aiOut.className = 'ai-out';
  aiOut.style.display = 'none';
  w.appendChild(aiOut);

  aiBtn.onclick = async function() {
    if (!GEMINI_API_KEY) {
      toast('⚠️ Isi API Key Gemini dulu di panel kiri.', 'err', 4000);
      return;
    }
    aiBtn.disabled = true;
    aiBtn.textContent = '⏳ Menghasilkan...';
    aiOut.style.display = 'block';
    aiOut.innerHTML = '<div class="ai-head"><b>Hasil AI</b></div><pre style="color:var(--muted);">Meminta hasil ke Gemini…</pre>';
    try {
      const hasil = await generateWithGemini(text);
      const clean = (hasil || '').trim();
      const head = document.createElement('div');
      head.className = 'ai-head';
      const lb = document.createElement('b');
      lb.textContent = '✅ Hasil AI';
      const cb = document.createElement('button');
      cb.className = 'copy';
      cb.textContent = 'Salin';
      cb.onclick = () => salin(clean, cb);
      head.appendChild(lb);
      head.appendChild(cb);
      const pre = document.createElement('pre');
      pre.textContent = clean || '(tidak ada hasil)';
      aiOut.innerHTML = '';
      aiOut.appendChild(head);
      aiOut.appendChild(pre);
    } catch (err) {
      aiOut.innerHTML = '<div class="ai-head"><b style="color:var(--danger);">❌ Gagal</b></div>' +
        '<pre style="color:var(--danger);">' + (err.message || 'Terjadi kesalahan') + '</pre>';
    } finally {
      aiBtn.disabled = false;
      aiBtn.textContent = '✨ Generate AI';
    }
  };

  return w;
}

function guliInstan(el, offset) {
  const y = el.getBoundingClientRect().top + window.pageYOffset - (offset || 78);
  window.scrollTo(0, y < 0 ? 0 : y);
}

function nanti(fn) {
  if (window.requestAnimationFrame) {
    requestAnimationFrame(() => requestAnimationFrame(fn));
  } else {
    setTimeout(fn, 0);
  }
}

function acak(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return n ? a.slice(0, n) : a;
}

function pecahTopik(topik, jumlah) {
  const T = (topik || 'materi ini').replace(/^(BAB|Bab)\s*\d*\s*/, '').trim();
  const pola = [
    'Pengertian dan Ciri ' + T,
    'Jenis-jenis ' + T,
    'Bagian dan Unsur ' + T,
    'Proses dan Cara Kerja ' + T,
    'Contoh ' + T + ' dalam Kehidupan Sehari-hari',
    'Manfaat dan Dampak ' + T,
    'Rumus dan Perhitungan ' + T,
    'Perbedaan dan Perbandingan pada ' + T,
    'Faktor yang Mempengaruhi ' + T,
    'Latihan dan Penerapan ' + T
  ];
  return pola.slice(0, jumlah || 5);
}

const NAMA_CONTOH = [
  'Andi Pratama', 'Bunga Lestari', 'Citra Ayu', 'Dimas Saputra',
  'Eka Wulandari', 'Fajar Nugroho', 'Gita Permata', 'Hendra Wijaya',
  'Indah Sari', 'Joko Susilo', 'Kiran Maharani', 'Lukman Hakim',
  'Maya Anggraini', 'Nanda Pratiwi', 'Oka Ramadhan', 'Putri Amelia',
  'Rizky Fauzan', 'Sinta Dewi', 'Taufik Hidayat', 'Umi Kalsum'
];

// ================================================================
// 5. GEMINI API
// ================================================================

async function generateWithGemini(promptText) {
  if (!GEMINI_API_KEY) {
    throw new Error('API Key belum diisi. Masukkan API Key Gemini di panel kiri (sidebar).');
  }
  
  const response = await fetch(GEMINI_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 8192,
        topP: 0.95,
        topK: 40,
      }
    })
  });
  
  if (!response.ok) {
    const errorData = await response.json();
    throw new Error(`Gemini API Error: ${errorData.error?.message || response.statusText}`);
  }
  
  const data = await response.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

// ================================================================

// ================================================================

const IDE = {

  tujuan: function(g) {
    const T = (g('materi') || g('bab') || 'materi ini').trim();

    return 'Murid mampu ' + kko[0] + ' konsep ' + T + ' dengan tepat; ' +
           'murid mampu ' + kko[1] + ' penerapan ' + T + '; ' +
           'murid mampu ' + kko[2] + ' hasil pengamatannya secara mandiri.';
  },
  posterIsi: function(g) {
    const j = String(g('jenis') || '').toUpperCase();
    const P = {
      'TATA TERTIB': ['Datang tepat waktu', 'Berpakaian rapi', 'Mengucapkan salam', 'Menjaga kebersihan', 'Tidak makan saat pelajaran', 'Mengumpulkan tugas tepat waktu', 'Menghormati teman', 'Meminta izin sebelum keluar'],
      'PIKET': ['Menyapu lantai', 'Mengepel', 'Menghapus papan tulis', 'Merapikan meja kursi', 'Membuang sampah', 'Menyiram tanaman', 'Mematikan lampu'],
      'SUDUT BACA': ['Ambil buku dengan tangan bersih', 'Baca dengan tenang', 'Kembalikan buku ke rak', 'Jangan melipat halaman', 'Catat judul buku', 'Ajak teman membaca']
    };
    for (const k in P) { if (j.indexOf(k) > -1) return P[k].join('\n'); }
    return ['(poin 1)', '(poin 2)', '(poin 3)', '(poin 4)', '(poin 5)', '(poin 6)'].join('\n');
  },
  dataNilai: function(g) {
    const n = Math.min(parseInt(g('nsiswa'), 10) || 10, 24);
    const ns = parseInt(g('nsoal'), 10) || 10;
    const out = ['Nama | Skor per butir (1=benar, 0=salah)'];

      out.push(nm + ' | ' + b.join(','));
    });
    out.push('', '(Ini contoh format. Hapus lalu tempel data aslimu.)');
    return out.join('\n');
  },
  idePoster: function() { return acak(['POSTER JADWAL SHOLAT', 'POSTER POJOK LITERASI', 'POSTER KESEPAKATAN KELAS'], 1)[0]; },
  ideSertifikat: function() { return acak(['PIAGAM PELANTIKAN OSIS', 'SERTIFIKAT TERAJIN', 'PIAGAM APRESIASI'], 1)[0]; },
  ideInteraktif: function(g) {
    const T = (g('materi') || 'materi').trim();
    return acak(['PERMAINAN DOMINO ' + T, 'BINGO KOSAKATA ' + T, 'KARTU MISTERI ' + T], 1)[0];
  },
  ideHalaman: function() { return acak(['2 halaman A4', '3 halaman A4', '4 halaman A4 dijilid'], 1)[0]; },
  karakterIde: function() { return acak(['nenek pendongeng berkebaya', 'ilmuwan muda berjas lab', 'petani ramah bertopi caping'], 1)[0]; }

// --- 8a. Ringkasan Materi ---
function promptRingkasan(item, sub, seed, idx, o) {
  o = o || {};
  const G = {
    gaya: o.gaya || 'ilustrasi kartun edukatif',
    ukuran: o.ukuran || 'A4 Portrait',
    maskot: o.maskot || '',
    seri: o.seri || 'on',
    identitas: (o.identitas || '').trim()
  };
  
  function warnaUntuk(mapel, idx) {
    const p = o.warna || 'AUTO';
    if (p !== 'AUTO') return p;
    const key = mapel.toLowerCase().trim();
    if (WARNA_MAPEL[key]) return WARNA_MAPEL[key];
    return WARNA_CADANGAN[idx % WARNA_CADANGAN.length];
  }
  
  function padatUntuk(kelas) {
    const p = o.padat || 'AUTO';
    if (p !== 'AUTO') return p;
    const k = kelas.toUpperCase();
    const angka = (k.match(/\d+/) || [''])[0];
    const n = angka ? parseInt(angka, 10) : 0;
    if (n && n <= 6) return 'ringkas — hanya poin-poin inti, banyak ruang kosong, cocok untuk anak SD';
    if (n && n <= 9) return 'sedang — poin inti disertai penjelasan singkat 1–2 kalimat per bagian';
    return 'padat — penjelasan lengkap, rumus, dan contoh, namun tetap tertata rapi';
  }
  
  function pilihElemen() {
    return (o.elemen || []).filter(Boolean);
  }
  
  const L = [];
  L.push('Peran: Desainer Grafis Instruksional dan Ahli Media Pembelajaran.');
  L.push('');
  L.push('Buatkan ringkasan materi pembelajaran untuk:');
  L.push('• Mata Pelajaran : ' + item.mapel);
  L.push('• Kelas / Fase   : ' + item.kelas);
  L.push('• Bab / Topik    : ' + item.bab);
  L.push('• Submateri      : ' + sub);
  L.push('');
  L.push('Desain sebagai poster belajar / lembar ringkasan edukatif ' + G.ukuran + ' yang ' + V_TUTUP[seed % V_TUTUP.length] + '.');
  L.push('');
  L.push('KETENTUAN DESAIN');
  L.push('- Gaya visual: ' + G.gaya + '.');
  L.push('- Palet warna: ' + warnaUntuk(item.mapel, idx) + '.');
  if (G.maskot) L.push('- Sertakan ' + G.maskot + '.');
  L.push('- ' + V_LAYOUT[seed % V_LAYOUT.length] + '.');
  L.push('- Kepadatan isi: ' + padatUntuk(item.kelas) + '.');
  if (G.seri === 'on') L.push('- Poster ini bagian dari satu seri: pertahankan template yang sama.');
  L.push('');
  L.push('ISI YANG HARUS ADA');
  pilihElemen().forEach((e, i) => L.push((i + 1) + '. Sertakan ' + e + '.'));
  if (item.poin) {
    L.push('');
    L.push('POIN WAJIB DARI GURU');
    item.poin.split(/,|;/).map(s => s.trim()).filter(Boolean).forEach(p => L.push('- ' + p));
  }
  if (G.identitas) {
    L.push('');
    L.push('Cetak kecil di bagian bawah poster: "' + G.identitas + '".');
  }
  L.push('');
  L.push('ATURAN PENTING');
  L.push('- Seluruh teks WAJIB dalam Bahasa Indonesia, ejaan benar, tanpa typo.');
  L.push('- Isi materi harus benar secara keilmuan dan sesuai tingkat ' + item.kelas + '.');
  L.push('- Jangan ada teks yang terpotong atau tertumpuk gambar.');
  L.push('- Resolusi tinggi dan tajam, siap cetak (300 DPI).');
  return L.join('\n');
}

function buatField(f, store) {
  if (f.t === 'sec') {
    const d = document.createElement('div');
    d.className = 'fsec';
    d.textContent = f.label;
    return d;
  }
  if (f.t === 'row' || f.t === 'row3') {
    const d = document.createElement('div');
    d.className = f.t;
    (f.kids || []).forEach(k => d.appendChild(buatField(k, store)));
    return d;
  }
  
  const wrap = document.createElement('div');
  wrap.className = 'field';
  
  if (f.t === 'switch') {
    wrap.className = '';
    const lab = document.createElement('label');
    lab.className = 'switch';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!f.on;
    const sp = document.createElement('span');
    sp.textContent = f.label;
    lab.appendChild(cb);
    lab.appendChild(sp);
    wrap.appendChild(lab);
    store[f.k] = () => cb.checked;
    if (store.__set) store.__set[f.k] = function(v) { if (typeof v === 'boolean') cb.checked = v; };
    return wrap;
  }
  
  const lab = document.createElement('label');
  lab.innerHTML = f.label;
  if (f.ide && IDE[f.ide]) {
    const bar = document.createElement('div');
    bar.className = 'lbl-row';
    const bi = document.createElement('button');
    bi.className = 'btn-ide';
    bi.type = 'button';
    bi.textContent = '💡 Ide dari AI';
    bar.appendChild(lab);
    bar.appendChild(bi);
    wrap.appendChild(bar);
    wrap._ideBtn = bi;
    wrap._ideFn = f.ide;
  } else {
    wrap.appendChild(lab);
  }
  
  if (f.t === 'chips') {
    const box = document.createElement('div');
    box.className = 'chips';
    (f.opts || []).forEach(([k, full, desc]) => {
      const label = full;            // teks yang tampil di chip
      const value = desc || full;    // nilai yang disimpan ke store
      const c = document.createElement('div');
      c.className = 'chip' + ((f.on || []).includes(k) ? ' on' : '');
      c.dataset.full = value;
      c.textContent = label.length > 46 ? label.slice(0, 44).replace(/\s\S*$/, '') + '…' : label;
      c.title = value;
      c.onclick = () => c.classList.toggle('on');
      box.appendChild(c);
    });
    wrap.appendChild(box);
    store[f.k] = () => [...box.querySelectorAll('.chip.on')].map(c => c.dataset.full);
    if (store.__set) store.__set[f.k] = function(v) {
      if (!Array.isArray(v)) return;
      box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', v.indexOf(c.dataset.full) > -1));
    };
    return wrap;
  }
  
  let el;
  if (f.t === 'select') {
    el = document.createElement('select');
    (f.opts || []).forEach(([val, txt]) => {
      const o = document.createElement('option');
      o.value = val;
      o.innerHTML = txt;
      el.appendChild(o);
    });
  } else if (f.t === 'textarea') {
    el = document.createElement('textarea');
    if (f.ph) el.placeholder = f.ph;
    if (f.h) el.style.minHeight = f.h + 'px';
  } else {
    el = document.createElement('input');
    if (f.t === 'mapel') el.setAttribute('list', 'mapelList');
    if (f.ph) el.placeholder = f.ph;
  }
  wrap.appendChild(el);
  store[f.k] = () => el.value.trim ? el.value.trim() : el.value;
  if (store.__set) store.__set[f.k] = function(v) { if (v != null) el.value = v; };
  
  if (wrap._ideBtn) {
    const fn = wrap._ideFn;
    wrap._ideBtn.onclick = function() {
      const g = function(k) { return store[k] ? store[k]() : ''; };
      el.value = IDE[fn](g);
      el.dispatchEvent(new Event('input'));
      wrap._ideBtn.textContent = '💡 Ide lain';
      toast('Ide terisi — silakan diedit', 'info', 1900);
      el.focus();
    };
  }
  return wrap;
}

function buildRingkasan(v) {
  const hasil = [];
  const elemen = (v.elemen || []).filter(Boolean);
  const o = {
    gaya: v.gaya, ukuran: v.ukuran, maskot: v.maskot, seri: v.seri,
    identitas: v.identitas, warna: v.warna, padat: v.padat, elemen: elemen
  };
  const subs = (v.sub || '').split('\n').map(s => s.trim()).filter(Boolean);
  const item = {
    mapel: v.mapel, kelas: v.kelas, bab: v.bab,
    poin: (v.poin || '').trim()
  };

  if (!item.mapel || !subs.length) {
    return [{ title: '⚠️ Data belum lengkap', text: 'Minimal isi Mata Pelajaran dan Submateri (satu baris = satu poster).' }];
  }

  let seed = 0;
  subs.forEach(function(sub) {
    const idText = promptRingkasan(item, sub, seed++, 0, o);
    hasil.push({ title: item.mapel + ' · ' + sub, text: idText });
    if (v.enEnglish) {
      const enText = promptEN(item, sub, seed, o);
      hasil.push({ title: 'EN · ' + item.mapel + ' · ' + sub, text: enText });
    }
  });

  return hasil;
}

function promptEN(item, sub, idx, o) {
  o = o || {};
  const G = { gaya: o.gaya || 'ilustrasi kartun edukatif', ukuran: o.ukuran || 'A4 Portrait', maskot: o.maskot || '', identitas: (o.identitas || '').trim() };
  function warnaUntuk(mapel, i) {
    const p = o.warna || 'AUTO';
    if (p !== 'AUTO') return p;
    const key = mapel.toLowerCase().trim();
    if (WARNA_MAPEL[key]) return WARNA_MAPEL[key];
    return WARNA_CADANGAN[i % WARNA_CADANGAN.length];
  }
  const L = [];
  L.push('Role: Instructional Graphic Designer and Learning Media Expert.');
  L.push('');
  L.push('Create an educational summary poster about "' + sub + '" (chapter: ' + item.bab + ', subject: ' + item.mapel + ', grade: ' + item.kelas + ').');
  L.push('Format: ' + G.ukuran + ', print-ready, 300 DPI.');
  L.push('Visual style: ' + G.gaya + '.');
  L.push('Color palette: ' + warnaUntuk(item.mapel, idx) + '.');
  if (G.maskot) L.push('Include ' + G.maskot + '.');
  L.push('Layout: clean grid, clear hierarchy, generous spacing.');
  L.push('Must include: ' + (o.elemen || []).filter(Boolean).join('; ') + '.');
  if (item.poin) L.push('Teacher notes: ' + item.poin + '.');
  if (G.identitas) L.push('Footer: "' + G.identitas + '".');
  L.push('IMPORTANT: all text in correct Indonesian, no typos.');
  return L.join('\n');
}

function buildRpm(v) {
  const dims = (v.dimensi || []).filter(Boolean);
  const lamps = (v.lampiran || []).filter(Boolean);
  const id = {
    sekolah: (v.sekolah || '(nama sekolah)').trim(),
    tahun: (v.tahun || '2026/2027').trim(),
    guru: (v.guru || '(nama guru)').trim(),

    kepsek: (v.kepsek || '(nama kepala sekolah)').trim(),
    nipkep: (v.nipkep || '').trim(),
    semester: v.semester || 'Ganjil',
    kota: (v.kota || '(kota)').trim(),
    tanggal: (v.tanggal || 'Juli 2026').trim(),
    jenis: v.jenis || 'RPM',
    pedagogi: v.pedagogi || 'Pembelajaran Berbasis Masalah (Problem Based Learning)',
    gayatulis: v.gayatulis || 'bahasa formal administratif sesuai kaidah dokumen kedinasan sekolah, kalimat efektif dan baku',
    dalam: v.dalam || 'lengkap dan detail, setiap bagian diuraikan menyeluruh siap dipakai tanpa banyak revisi',
    tema: v.tema || 'modern edukatif — bentuk geometris lembut, gradasi biru dan tosca, ikon pendidikan minimalis',
    tagline: (v.tagline || '').trim()
  };

  if (!v.mapel || !v.bab) {
    return [{ title: '⚠️ Data belum lengkap', text: 'Minimal isi Mata Pelajaran dan Bab / Materi Pokok.' }];
  }

  const it = {
    mapel: v.mapel, kelas: v.kelas, bab: v.bab,
    jp: v.jp || '6 JP', tm: (v.tm || '').trim(), dur: (v.dur || '').trim(),
    tp: (v.tp || '').trim(), note: (v.note || '').trim()
  };

  const hasil = [];
  hasil.push({ title: '① Prompt Dokumen · ' + it.mapel, text: rPromptDok(id, it, dims, lamps) });
  hasil.push({ title: '② Prompt Cover · ' + it.mapel, text: rPromptCover(id, it) });
  if (v.bg) hasil.push({ title: '③ Prompt Background Halaman', text: rPromptBg(id) });
  return hasil;
}

function pasangTool(T) {
  const sec = document.createElement('section');
  sec.className = 'view';
  sec.id = 'v_' + T.id;
  
  // Topbar
  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = '<div class="brand">SANGCREATOR</div><h1>' + T.judul + '</h1><p class="sub">' + T.sub + '</p>';
  sec.appendChild(top);
  
  const pill = document.createElement('div');
  pill.className = 'pill pill-free';
  pill.textContent = '✅ GRATIS';
  top.appendChild(pill);
  
  // Card
  const card = document.createElement('div');
  card.className = 'card';
  const h = document.createElement('h2');
  h.textContent = 'Isi Data';
  card.appendChild(h);
  
  const gen = document.createElement('button');
  gen.className = 'btn btn-main';
  gen.style.marginTop = '6px';
  gen.textContent = '✨ Buat Prompt';
  
  const store = {};
  store.__set = {};
  const KEY = 'sc_draft_' + T.id;
  let simpanTimer = null, tagDraft = null;
  store.__dirty = function() {
    if (simpanTimer) clearTimeout(simpanTimer);
    simpanTimer = setTimeout(function() {
      try {
        const d = {};
        Object.keys(store).forEach(function(k) {
          if (k.indexOf('__') === 0) return;
          d[k] = store[k]();
        });
        localStorage.setItem(KEY, JSON.stringify(d));
        if (tagDraft) {
          tagDraft.textContent = '✓ Draft tersimpan';
          tagDraft.classList.add('on');
          setTimeout(function() { tagDraft.classList.remove('on'); }, 1900);
        }
      } catch (e) {}
    }, 500);
  };
  
  let sudahBangun = false;
  sec._bangun = function() {
    if (sudahBangun) return;
    sudahBangun = true;
    const frag = document.createDocumentFragment();
    (T.fields || []).forEach(f => frag.appendChild(buatField(f, store)));
    card.insertBefore(frag, gen);
    tagDraft = document.createElement('div');
    tagDraft.className = 'draft-tag';
    card.insertBefore(tagDraft, gen);
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d) Object.keys(d).forEach(function(k) { if (store.__set[k]) store.__set[k](d[k]); });
    } catch (e) {}
  };
  
  card.appendChild(gen);
  sec.appendChild(card);
  
  // Output
  const oh = document.createElement('div');
  oh.className = 'out-head';
  const h3 = document.createElement('h3');
  h3.textContent = 'Hasil Prompt';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = '0 prompt';
  const all = document.createElement('button');
  all.className = 'btn btn-ghost';
  all.style.padding = '7px 12px';
  all.textContent = '📋 Salin Semua';
  oh.appendChild(h3);
  oh.appendChild(badge);
  oh.appendChild(all);
  sec.appendChild(oh);
  
  const out = document.createElement('div');
  out.innerHTML = '<div class="card empty">Isi data di atas lalu tekan <b>Buat Prompt</b>.</div>';
  sec.appendChild(out);
  
  let hasil = [];
  gen.onclick = function() {
    gen.textContent = '⏳ Menyusun...';
    nanti(function() {
      const v = {};
      Object.keys(store).forEach(function(k) {
        if (k.indexOf('__') !== 0) v[k] = store[k]();
      });
      const r = T.build(v) || [];
      gen.textContent = '✨ Buat Prompt';
      
      // Semua tools gratis
      hasil = r;
      const frag = document.createDocumentFragment();
      hasil.forEach(b => frag.appendChild(blok(b.title, b.text)));
      out.innerHTML = '';
      out.appendChild(frag);
      badge.textContent = hasil.length + ' prompt';
      guliInstan(out);
      toast(hasil.length + ' prompt siap disalin', 'ok');
      store.__dirty();
    });
  };
  
  card.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      gen.click();
    }
  });
  
  all.onclick = function() {
    if (!hasil.length) {
      toast('Belum ada prompt. Tekan "Buat Prompt" dulu.', 'info');
      return;
    }
    salin(hasil.map(b => '===== ' + b.title + ' =====\n' + b.text).join('\n\n\n'), this);
  };
  
  document.getElementById('genericViews').appendChild(sec);
}

// Field yang disatukan ke "Identitas Umum" (diinject ke semua tool, disembunyikan dari card)
const UMUM_KEYS = ['mapel', 'kelas', 'sekolah', 'guru'];
const UMUM_DRAFT = 'sc_wizard_umum';
const URUTAN_GRUP = ['MEDIA BELAJAR', 'PERENCANAAN', 'PENILAIAN', 'ADMINISTRASI', 'KOMUNIKASI'];

const UMUM_FIELDS = [
  { t: 'row', kids: [
    { t: 'mapel', k: 'mapel', label: 'Mata Pelajaran' },
    { t: 'text', k: 'kelas', label: 'Kelas / Fase', ph: 'IX / D' }
  ]},
  { t: 'row', kids: [
    { t: 'text', k: 'sekolah', label: 'Nama Sekolah', ph: 'SMPN 1 Sukamaju' },
    { t: 'text', k: 'guru', label: 'Nama Guru / Penyusun', ph: 'Rina Kartika, S.Pd.' }
  ]}
];

function readStore(store) {
  const v = {};
  Object.keys(store).forEach(function(k) { if (k.indexOf('__') === 0) return; v[k] = store[k](); });
  return v;
}

function skipUmum(toolId, k) {
  if (UMUM_KEYS.indexOf(k) === -1) return false;
  if (toolId === 'pesan') return false; // pesan punya makna khusus utk guru/kelas/sekolah
  return true;
}

function filterUmumFields(toolId, fields) {
  const out = [];
  (fields || []).forEach(function(f) {
    if (f.t === 'row' || f.t === 'row3') {
      const kids = filterUmumFields(toolId, f.kids || []);
      if (kids.length) out.push(Object.assign({}, f, { kids: kids }));
    } else if (f.k && skipUmum(toolId, f.k)) {
      // field umum -> dihandle di identitas umum
    } else {
      out.push(f);
    }
  });
  return out;
}

const toolStores = {};   // id -> store (field spesifik)
const toolChecked = {};  // id -> true/false

function renderWizard() {
  // ===== Main: wizard =====
  const mainBox = document.getElementById('genericViews');
  mainBox.innerHTML = '';

  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = '<div class="brand">SANGCREATOR</div><h1>Studio Guru AI</h1>' +
    '<p class="sub">Isi identitas umum sekali → pilih output → generate semua prompt sekaligus</p>';
  mainBox.appendChild(top);

  function updateCount() {
    const n = TOOLS.filter(function(T) { return toolChecked[T.id]; }).length;
    const c = document.getElementById('wizCount');
    if (c) c.textContent = n + ' dipilih';
  }

  // ===== Pilih Output (chips) =====
  const outCard = document.createElement('div');
  outCard.className = 'card';
  outCard.innerHTML = '<h2>Pilih Output</h2>';
  const grid = document.createElement('div');
  grid.className = 'outp-grid';
  TOOLS.forEach(function(T) {
    const chip = document.createElement('div');
    chip.className = 'outp-chip';
    chip.innerHTML = '<span class="oc-ic">' + T.icon + '</span><span>' + T.nama + '</span>';
    chip.title = T.desc;
    chip.onclick = function() {
      const on = chip.classList.toggle('on');
      toolChecked[T.id] = on;
      updateCount();
      toggleToolCard(T, on);
    };
    grid.appendChild(chip);
  });
  outCard.appendChild(grid);
  mainBox.appendChild(outCard);

  // ===== Identitas Umum =====
  const umumCard = document.createElement('div');
  umumCard.className = 'card umum-card';
  umumCard.innerHTML = '<h2>Identitas Umum</h2>' +
    '<p class="hint" style="margin:0 0 6px;">Otomatis dipakai di semua output yang dipilih.</p>';
  mainBox.appendChild(umumCard);

  const umumStore = { __set: {} };
  UMUM_FIELDS.forEach(function(f) { umumCard.appendChild(buatField(f, umumStore)); });

  try {
    const d = JSON.parse(localStorage.getItem(UMUM_DRAFT) || 'null');
    if (d) Object.keys(d).forEach(function(k) { if (umumStore.__set[k]) umumStore.__set[k](d[k]); });
  } catch (e) {}

  umumCard.addEventListener('input', function() {
    clearTimeout(umumCard.__t);
    umumCard.__t = setTimeout(function() {
      try { localStorage.setItem(UMUM_DRAFT, JSON.stringify(readStore(umumStore))); } catch (e) {}
    }, 400);
  });

  // Card 2: Field spesifik (muncul saat dicentang)
  const secHead = document.createElement('div');
  secHead.className = 'wiz-sec-head';
  secHead.innerHTML = '<h3>Isi Detail</h3><span class="badge" id="wizCount">0 dipilih</span>';
  mainBox.appendChild(secHead);

  const cardsBox = document.createElement('div');
  cardsBox.id = 'wizCards';
  mainBox.appendChild(cardsBox);

  // Tombol generate
  const genBtn = document.createElement('button');
  genBtn.className = 'btn btn-main';
  genBtn.style.marginTop = '14px';
  genBtn.textContent = '✨ Generate Semua Prompt';
  mainBox.appendChild(genBtn);

  // Area hasil
  const outHead = document.createElement('div');
  outHead.className = 'out-head';
  outHead.innerHTML = '<h3>Hasil Prompt</h3><span class="badge">0 prompt</span>' +
    '<button class="btn btn-ghost" style="padding:7px 12px;">📋 Salin Semua</button>';
  mainBox.appendChild(outHead);

  const resultsBox = document.createElement('div');
  resultsBox.id = 'wizResults';
  const resultsEmpty = document.createElement('div');
  resultsEmpty.className = 'card empty';
  resultsEmpty.textContent = 'Centang output di kiri, isi detail, lalu tekan Generate.';
  resultsBox.appendChild(resultsEmpty);
  mainBox.appendChild(resultsBox);

  const badge = outHead.querySelector('.badge');
  const copyAllBtn = outHead.querySelector('.btn');

  // ===== Toggle card spesifik =====
  function toggleToolCard(T, on) {
    let card = document.getElementById('wizcard_' + T.id);
    if (!card && on) {
      card = document.createElement('div');
      card.className = 'wiz-card';
      card.id = 'wizcard_' + T.id;
      card.innerHTML = '<div class="wtit">' + T.icon + ' ' + T.nama + '</div>' +
        '<div class="wsub">' + T.sub + '</div>';
      const st = { __set: {} };
      toolStores[T.id] = st;
      const DKEY = 'sc_wizard_' + T.id;
      filterUmumFields(T.id, T.fields).forEach(function(f) { card.appendChild(buatField(f, st)); });
      // restore draft
      try {
        const d = JSON.parse(localStorage.getItem(DKEY) || 'null');
        if (d) Object.keys(d).forEach(function(k) { if (st.__set[k]) st.__set[k](d[k]); });
      } catch (e) {}
      card.addEventListener('input', function() {
        clearTimeout(card.__t);
        card.__t = setTimeout(function() {
          try { localStorage.setItem(DKEY, JSON.stringify(readStore(st))); } catch (e) {}
        }, 400);
      });
      // posisikan setelah head section (sebelum cardsBox).append? -> append ke cardsBox
      cardsBox.appendChild(card);
    }
    if (card) card.classList.toggle('on', on);
  }

  // ===== Generate =====
  function generateAll() {
    const checked = TOOLS.filter(function(T) { return toolChecked[T.id]; });
    if (!checked.length) { toast('Centang dulu minimal satu output di panel kiri.', 'info'); return; }

    const umumV = readStore(umumStore);
    resultsBox.innerHTML = '';
    let total = 0;

    checked.forEach(function(T) {
      const st = toolStores[T.id] || { __set: {} };
      const v = Object.assign({}, umumV, readStore(st));
      const r = T.build(v) || [];
      total += r.length;

      const head = document.createElement('div');
      head.className = 'wiz-result';
      head.innerHTML = '<div class="rtit">' + T.icon + ' ' + T.nama +
        ' <span class="badge">' + r.length + ' prompt</span></div>';
      resultsBox.appendChild(head);
      r.forEach(function(b) { resultsBox.appendChild(blokAI(b.title, b.text)); });
    });

    badge.textContent = total + ' prompt';
    guliInstan(resultsBox);
    toast(total + ' prompt siap disalin', 'ok');
    resultsBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  genBtn.onclick = function() {
    genBtn.textContent = '⏳ Menyusun...';
    nanti(function() { generateAll(); genBtn.textContent = '✨ Generate Semua Prompt'; });
  };

  copyAllBtn.onclick = function() {
    const titles = resultsBox.querySelectorAll('.block-title');
    const et = [];
    resultsBox.querySelectorAll('.block-title').forEach(function(b) {
      const pre = b.closest('.block') ? b.closest('.block').querySelector('pre') : null;
      if (pre) et.push('===== ' + b.textContent + ' =====\n' + pre.textContent);
    });
    if (!et.length) { toast('Belum ada hasil. Generate dulu.', 'info'); return; }
    salin(et.join('\n\n\n'), this);
  };

  updateCount();
}

// ================================================================
// 16. API KEY INITIALIZATION
// ================================================================

async function initGeminiAPI(force) {
  const statusEl = document.getElementById('apiStatus');
  
  if (!GEMINI_API_KEY) {
    statusEl.className = 'api-status err';
    statusEl.innerHTML = '❌ <b>API Key belum diisi!</b><br><span style="font-size:10px;">Isi API Key Gemini di kolom bawah.</span>';
    return;
  }
  
  // Cache status koneksi (5 menit) supaya tidak ping Gemini setiap kali load.
  const CACHE_KEY = 'sc_api_status';
  const CACHE_TTL = 5 * 60 * 1000;
  const fingerprint = GEMINI_MODEL + '|' + GEMINI_API_KEY.length + '|' + GEMINI_API_KEY.slice(0, 4);
  if (!force) {
    try {
      const cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null');
      if (cached && cached.fp === fingerprint && (Date.now() - cached.ts) < CACHE_TTL) {
        API_READY = true;
        statusEl.className = 'api-status ok';
        document.getElementById('apiStatus').innerHTML = '✅ <b>Gemini API siap digunakan</b><br><span class="key">Model: ' + GEMINI_MODEL + '</span>';
        return;
      }
    } catch (e) {}
  }
  
  statusEl.className = 'api-status';
  statusEl.innerHTML = '🔄 Menguji koneksi ke Gemini API...';
  
  try {
    const testResponse = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: 'Balas dengan "OK" saja.' }] }],
        generationConfig: { maxOutputTokens: 10 }
      })
    });
    
    if (!testResponse.ok) {
      const error = await testResponse.json();
      throw new Error(error.error?.message || 'API Key tidak valid.');
    }
    
    API_READY = true;
    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ fp: fingerprint, ts: Date.now() })); } catch (e) {}
    statusEl.className = 'api-status ok';
    statusEl.innerHTML = '✅ <b>Gemini API siap digunakan</b><br><span class="key">Model: ' + GEMINI_MODEL + '</span>';
    toast('Gemini API berhasil terhubung!', 'ok', 3000);
    
  } catch (error) {
    statusEl.className = 'api-status err';
    statusEl.innerHTML = '❌ <b>Gagal terhubung ke Gemini</b><br><span style="font-size:10px;">' + error.message + '</span>';
    toast('⚠️ ' + error.message, 'err', 5000);
    API_READY = false;
  }
}
