<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SANGCREATOR · Studio Guru AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    /* ===== SAME STYLES AS PREVIOUS VERSION ===== */
    /* (Copy semua style dari versi sebelumnya) */
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --ink: #12172b;
      --muted: #5f6b85;
      --line: #e3e8f2;
      --accent: #5b4bd6;
      --accent-2: #f5a623;
      --accent-soft: #efecff;
      --side: #141a2e;
      --side-ink: #c9d2e8;
      --side-line: #26304c;
      --ok: #17a673;
      --danger: #e04f5f;
      --code-bg: #0f1424;
      --code-ink: #dfe6ff;
      --shadow: 0 6px 24px rgba(19,25,55,.07);
      --radius: 14px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    
    html[data-theme="dark"] {
      --bg: #0d1120;
      --card: #151b2e;
      --ink: #e9edf8;
      --muted: #98a3bd;
      --line: #242d47;
      --accent: #8b7cff;
      --accent-2: #ffbe4d;
      --accent-soft: #232145;
      --side: #0a0e1a;
      --side-ink: #aab6d2;
      --side-line: #1d2540;
      --code-bg: #080c17;
      --shadow: 0 6px 24px rgba(0,0,0,.35);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.55;
      transition: background .25s, color .25s;
    }
    
    /* ===== LAYOUT ===== */
    .app { display: flex; min-height: 100vh; }
    .side {
      width: 260px;
      flex: 0 0 260px;
      background: var(--side);
      color: var(--side-ink);
      padding: 18px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
      z-index: 70;
    }
    .side::-webkit-scrollbar { width: 5px; }
    .side::-webkit-scrollbar-thumb { background: #2b3555; border-radius: 4px; }
    .main { flex: 1; min-width: 0; padding: 20px 20px 80px; }
    .inner { max-width: 960px; margin: 0 auto; }
    
    /* ===== SIDE BRAND ===== */
    .side-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 16px;
      border-bottom: 1px solid var(--side-line);
      margin-bottom: 12px;
    }
    .side-brand .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      flex: 0 0 auto;
    }
    .side-brand .bn { font-size: 14px; font-weight: 800; color: #fff; letter-spacing: .4px; line-height: 1.2; }
    .side-brand .bs { font-size: 10.5px; color: #7b88a8; }
    
    /* ===== NAVIGATION ===== */
    .nav-label {
      font-size: 9.5px;
      letter-spacing: 1.8px;
      color: #5d6a90;
      font-weight: 800;
      padding: 14px 8px 6px;
      text-transform: uppercase;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: 11px;
      cursor: pointer;
      color: var(--side-ink);
      transition: .14s;
      border: 1px solid transparent;
    }
    .nav:hover { background: rgba(255,255,255,.05); }
    .nav.on {
      background: linear-gradient(135deg, rgba(139,124,255,.24), rgba(245,166,35,.12));
      border-color: rgba(139,124,255,.45);
      color: #fff;
    }
    .nav .ic { font-size: 17px; line-height: 1.25; flex: 0 0 auto; width: 22px; text-align: center; }
    .nav .tx { flex: 1; min-width: 0; }
    .nav .tx b { display: block; font-size: 12.5px; font-weight: 700; letter-spacing: -.1px; }
    .nav .tx span { display: block; font-size: 10px; color: #7f8cad; line-height: 1.3; margin-top: 1px; }
    .nav.on .tx span { color: #b9c2dd; }
    .badge-n {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .5px;
      padding: 2px 8px;
      border-radius: 6px;
      flex: 0 0 auto;
    }
    .badge-free { background: rgba(23,166,115,.22); color: #4ade9b; border: 1px solid rgba(23,166,115,.5); }
    .badge-pro { background: rgba(245,166,35,.18); color: #f5c069; border: 1px solid rgba(245,166,35,.45); }
    
    /* ===== SIDE FOOTER ===== */
    .side-foot {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--side-line);
      font-size: 10px;
      color: #5d6a90;
      text-align: center;
      line-height: 1.6;
    }
    .side-theme {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255,255,255,.06);
      border: 0;
      color: var(--side-ink);
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      font-family: inherit;
    }
    
    /* ===== API STATUS ===== */
    .api-status {
      background: rgba(23,166,115,.15);
      border: 1px solid rgba(23,166,115,.3);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      font-size: 11px;
      color: #7b88a8;
      text-align: center;
    }
    .api-status.ok { border-color: var(--ok); color: var(--ok); }
    .api-status.err { border-color: var(--danger); color: var(--danger); }
    .api-status .key { font-family: monospace; font-size: 10px; color: var(--accent); }
    
    .api-key-box {
      margin-bottom: 12px;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--side-line);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .api-key-label {
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .3px;
      color: #9fb0d4;
    }
    .api-key-box input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--side-line);
      border-radius: 8px;
      background: var(--side);
      color: var(--side-ink);
      font-size: 11.5px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .api-key-box input:focus { outline: 1px solid var(--accent); border-color: transparent; }
    .api-key-btn {
      border: 0;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #7a5cf0);
      color: #fff;
      font-family: inherit;
    }
    .api-key-btn:active { transform: scale(.97); }
    .api-key-hint {
      font-size: 9.5px;
      color: #5d6a90;
      line-height: 1.5;
    }
    .api-key-hint a { color: var(--accent); text-decoration: none; }
    
    /* ===== MAIN CONTENT ===== */
    .topbar { margin-bottom: 6px; }
    .brand {
      display: inline-block;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2.4px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-transform: uppercase;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.4px; }
    .sub { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
    .pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .6px;
      padding: 3px 10px;
      border-radius: 99px;
      margin-bottom: 6px;
    }
    .pill-free { background: rgba(23,166,115,.15); color: #0e9668; border: 1px solid rgba(23,166,115,.4); }
    .pill-pro { background: rgba(245,166,35,.16); color: #b87708; border: 1px solid rgba(245,166,35,.45); }
    html[data-theme="dark"] .pill-free { color: #5fe0a8; }
    html[data-theme="dark"] .pill-pro { color: #f5c069; }
    
    /* ===== CARDS ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      margin-top: 14px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .7px;
      color: var(--accent);
      margin: 0 0 12px;
    }
    .card h2 .lite {
      text-transform: none;
      letter-spacing: 0;
      color: var(--muted);
      font-weight: 400;
    }
    .fsec {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: .8px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }
    .fsec:first-child { margin-top: 0; }
    
    /* ===== FORM ===== */
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      margin: 0 0 5px;
      color: var(--muted);
    }
    .hint {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 400;
      margin-top: 4px;
    }
    input, select, textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--bg);
      color: var(--ink);
      font-size: 14px;
      font-family: inherit;
      transition: .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: transparent;
    }
    textarea { resize: vertical; min-height: 70px; }
    .field { margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media(max-width: 620px) { .row, .row3 { grid-template-columns: 1fr; } }
    
    /* ===== BUTTONS ===== */
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: transform .09s, background .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn-main {
      background: linear-gradient(135deg, var(--accent), #7a5cf0);
      color: #fff;
      width: 100%;
      margin-top: 4px;
      box-shadow: 0 4px 14px rgba(91,75,214,.32);
    }
    .btn-ghost {
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
    }
    .btn-add {
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px dashed var(--accent);
      width: 100%;
      font-size: 13.5px;
      padding: 11px;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .btn-row .btn { flex: 1; min-width: 118px; }
    .btn-ide {
      border: 1px solid var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 99px;
      cursor: pointer;
      font-family: inherit;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .btn-ide:active { transform: scale(.96); }
    
    /* ===== CHIPS ===== */
    .chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 99px;
      font-size: 12.5px;
      cursor: pointer;
      user-select: none;
      transition: .15s;
    }
    .chip.on {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .chip:active { transform: scale(.985); }
    
    /* ===== SWITCH ===== */
    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--bg);
      cursor: pointer;
      margin-bottom: 11px;
    }
    .switch input { width: auto; margin: 0; accent-color: var(--accent); transform: scale(1.15); }
    .switch span { font-size: 13.5px; font-weight: 600; color: var(--ink); }
    
    /* ===== OUTPUT ===== */
    .out-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 12px;
      flex-wrap: wrap;
    }
    .out-head h3 { font-size: 15px; margin: 0; flex: 1; }
    .badge {
      font-size: 11px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 700;
    }
    .block {
      background: var(--code-bg);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .block pre {
      margin: 0;
      color: var(--code-ink);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12.8px;
      line-height: 1.62;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .block-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .block-title {
      color: #8ea0d0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;
      text-transform: uppercase;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy {
      background: rgba(255,255,255,.09);
      color: #dfe6ff;
      border: 0;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      flex: 0 0 auto;
      transition: .15s;
    }
    .copy.done { background: var(--ok); color: #fff; }
    .copy:active { transform: scale(.97); }
    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 13.5px;
      padding: 30px 14px;
    }
    
    /* ===== VIEWS ===== */
    .view { display: none; }
    .view.on { display: block; animation: masuk .18s ease-out; }
    @keyframes masuk {
      from { opacity: 0; transform: translate3d(0, 8px, 0); }
      to { opacity: 1; transform: none; }
    }
    
    /* ===== TOAST ===== */
    #toastWrap {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 120;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
      width: max-content;
      max-width: 92vw;
    }
    .toast {
      background: #1b2136;
      color: #fff;
      padding: 11px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 26px rgba(0,0,0,.28);
      display: flex;
      align-items: center;
      gap: 9px;
      animation: toastIn .22s cubic-bezier(.2,.9,.3,1.3);
      border: 1px solid rgba(255,255,255,.09);
      max-width: 100%;
    }
    .toast.keluar { animation: toastOut .2s ease-in forwards; }
    .toast.ok { background: #0f8f63; }
    .toast.err { background: #c0394b; }
    .toast.info { background: #3b3486; }
    @keyframes toastIn {
      from { opacity: 0; transform: translate3d(0, 14px, 0) scale(.96); }
      to { opacity: 1; transform: none; }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translate3d(0, 10px, 0) scale(.97); }
    }
    
    /* ===== SCROLL TO TOP ===== */
    #keAtas {
      position: fixed;
      right: 20px;
      bottom: 24px;
      z-index: 90;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(19,25,55,.16);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      transform: translate3d(0, 8px, 0);
    }
    #keAtas.on { opacity: 1; pointer-events: auto; transform: none; }
    
    /* ===== RESPONSIVE ===== */
    @media(max-width: 880px) {
      .side {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 280px;
        flex: none;
        height: 100vh;
        transform: translateX(-102%);
        transition: transform .24s ease;
        box-shadow: 6px 0 26px rgba(0,0,0,.4);
      }
      .side.open { transform: translateX(0); }
      .main { padding: 14px 14px 60px; }
      #keAtas { bottom: 18px; right: 14px; }
      .mtop {
        display: flex;
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding: 10px 14px;
        align-items: center;
        gap: 12px;
      }
      .mtop .t { flex: 1; min-width: 0; }
      .mtop .t b { display: block; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .mtop .t span { font-size: 10px; color: var(--muted); letter-spacing: 1.2px; font-weight: 700; }
      .burger {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        width: 38px;
        height: 38px;
        border-radius: 11px;
        font-size: 18px;
        cursor: pointer;
        flex: 0 0 auto;
      }
      .scrim {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(6,10,22,.55);
        z-index: 65;
      }
      .scrim.on { display: block; }
    }
    .mtop { display: none; }
    
    /* ===== MATERI ===== */
    .materi {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      background: var(--bg);
    }
    .materi-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .materi-no {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex: 0 0 auto;
    }
    .materi-label {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .del {
      border: 0;
      background: transparent;
      color: var(--danger);
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
    }
    .lbl-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .lbl-row label { margin: 0; flex: 1; }
    .draft-tag {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 9px;
      text-align: right;
      opacity: 0;
      transition: opacity .25s;
    }
    .draft-tag.on { opacity: 1; }
    
    .skel {
      background: linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.14) 37%, rgba(255,255,255,.06) 63%);
      background-size: 400% 100%;
      animation: shim 1.1s ease-in-out infinite;
      border-radius: 8px;
      height: 12px;
    }
    @keyframes shim {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .view.on { animation: none; }
      .toast { animation: none; }
    }
  </style>
</head>
<body>

<!-- ===== TOP BAR MOBILE ===== -->
<div class="mtop">
  <button class="burger" id="burger">☰</button>
  <div class="t">
    <span>SANGCREATOR</span>
    <b id="mTitle">Studio Guru AI</b>
  </div>
  <button class="burger" id="themeM">🌙</button>
</div>
<div class="scrim" id="scrim"></div>

<!-- ===== APP ===== -->
<div class="app">
  
  <!-- ===== SIDEBAR ===== -->
  <aside class="side" id="side">
    <div class="side-brand">
      <div class="logo">SC</div>
      <div>
        <div class="bn">SANGCREATOR</div>
        <div class="bs">Studio Guru AI</div>
      </div>
    </div>
    
    <div class="api-status" id="apiStatus">⚙️ Menginisialisasi Gemini API...</div>
    
    <!-- API Key Input -->
    <div class="api-key-box" id="apiKeyBox">
      <div class="api-key-label">🔑 API Key Gemini</div>
      <input type="password" id="apiKeyInput" placeholder="Tempel API Key di sini" autocomplete="off">
      <button class="api-key-btn" id="apiKeySave">Simpan</button>
      <div class="api-key-hint">Key disimpan di browser ini saja (localStorage). <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Dapatkan key →</a></div>
    </div>
    
    <div id="navBox"></div>

let _toastAntri = [];
let _toastIdCounter = 0;

function toast(pesan, tipe, ms) {
  const w = document.getElementById('toastWrap');
  if (!w) return;
  const t = document.createElement('div');
  const id = ++_toastIdCounter;
  t.className = 'toast ' + (tipe || 'info');
  t.textContent = pesan;
  t.dataset.toastId = id;
  w.appendChild(t);
  _toastAntri.push(t);
  if (_toastAntri.length > 3) { const x = _toastAntri.shift(); x.remove(); }
  if (ms && ms > 0) {
    setTimeout(() => {
      t.classList.add('keluar');
      setTimeout(() => { t.remove(); _toastAntri = _toastAntri.filter(z => z !== t); }, 220);
    }, ms);
  }
  return id;
}

function closeToast(id) {
  const t = _toastAntri.find(el => parseInt(el.dataset.toastId) === id);
  if (t) {
    t.classList.add('keluar');
    setTimeout(() => { t.remove(); _toastAntri = _toastAntri.filter(z => z !== t); }, 220);
  }
}

function salin(text, btn) {
  const done = () => {
    if (!btn.dataset.old) btn.dataset.old = btn.textContent;
    btn.textContent = '✓ Tersalin';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = btn.dataset.old; btn.classList.remove('done'); }, 1600);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => { done(); toast('Prompt tersalin', 'ok'); })
      .catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); toast('Prompt tersalin', 'ok'); } 
  catch(e) { toast('Gagal menyalin', 'err', 3200); }
  document.body.removeChild(ta);
}

function blok(title, text) {
  const w = document.createElement('div');

  t.className = 'block-title';

  const b = document.createElement('button');
  b.className = 'copy';
  b.textContent = 'Salin';
  b.onclick = () => salin(text, b);
  bar.appendChild(t);
  bar.appendChild(b);
  const p = document.createElement('pre');
  p.textContent = text;
  w.appendChild(bar);
  w.appendChild(p);
  return w;
}

  if (window.requestAnimationFrame) {

  }
}

function acak(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return n ? a.slice(0, n) : a;
}

function pecahTopik(topik, jumlah) {

async function generateWithGemini(promptText) {
  if (!GEMINI_API_KEY) {
    throw new Error('API Key belum diisi. Masukkan API Key Gemini di panel kiri (sidebar).');
  }
  
  const response = await fetch(GEMINI_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: promptText }] }],
      generationConfig: {
        temperature: 0.7,
        maxOutputTokens: 8192,
        topP: 0.95,
        topK: 40,
      }
    })
  });
  
  if (!response.ok) {
    const errorData = await response.json();
    throw new Error(`Gemini API Error: ${errorData.error?.message || response.statusText}`);
  }
  
  const data = await response.json();
  return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

  C.push('Create a professional character design reference sheet of ' + karakter + '.');
  C.push('');
  C.push('SHEET LAYOUT');
  C.push('- 8 full-body views in one row: front 0°, front-3/4 45°, side 90°, back-3/4 135°, back 180°, back-3/4 225°, side 270°, front-3/4 315°.');
  C.push('- Second row: 4 head close-ups: neutral, smiling, explaining, surprised.');
  C.push('- Neutral A-pose, arms slightly away from body.');
  C.push('- Orthographic camera, no perspective distortion.');
  C.push('');
  C.push('RENDER SPEC');
  C.push('- Unreal Engine 5, Lumen GI, Nanite.');
  C.push('- PBR materials, realistic fabric, skin, hair.');
  C.push('- Style: ' + v.gaya);
  C.push('- Neutral 3-point studio lighting, soft shadows.');
  C.push('- Plain light grey background (#EDEDED), no props, no text.');
  C.push('- Ultra high detail, 8K, sharp focus.');
  C.push('');
  C.push('CONSISTENCY RULES');
  C.push('- Every view EXACT same character: same face, hair, clothing, colors.');
  C.push('- No watermark, signature, or text.');
  hasil.push({ title: '① Character Sheet 360° — Unreal', text: C.join('\n') });
  
  // Narasi
  const N = P();
  N.push('Peran: Guru Ahli dan penulis naskah video pembelajaran.');
  N.push('');
  N.push('Tulis NASKAH NARASI video pembelajaran untuk:');
  N.push('• Mata Pelajaran : ' + v.mapel);
  N.push('• Kelas / Fase   : ' + v.kelas);
  N.push('• Materi         : ' + v.materi);
  N.push('• Durasi         : ' + v.durasi + ' dibagi ke ' + n + ' scene');
  N.push('');
  N.push('SCENE');
  for (let i = 0; i < n; i++) {
    const judul = i === 0 ? 'Pembuka' : i === n - 1 ? 'Penutup' : (poin[i - 1] || 'Scene ' + (i + 1));
    N.push('Scene ' + (i + 1) + ' — ' + judul);
  }
  N.push('');
  N.push('KETENTUAN');
  N.push('- Gaya narasi: ' + v.narasi);
  N.push('- Tiap scene: durasi, NARASI, dan TEKS LAYAR (maks 8 kata).');
  N.push('- Scene pertama harus punya hook 3 detik pertama.');
  N.push('- Bahasa sesuai tingkat ' + v.kelas + '.');
  N.push('- Total durasi mendekati ' + v.durasi + '.');
  hasil.push({ title: '② Naskah Narasi ' + n + ' Scene', text: N.join('\n') });
  
  // Image & Video prompts per scene
  for (let i = 0; i < n; i++) {
    const sc = i + 1;
    const judul = i === 0 ? 'Pembuka' : i === n - 1 ? 'Penutup' : (poin[i - 1] || 'Scene ' + sc);
    
    // Image prompt
    const I = P();
    I.push('SCENE ' + sc + ' — IMAGE PROMPT (for ' + v.imgTarget + ')');
    I.push('Aspect: ' + v.rasio);
    I.push('');
    I.push('Use attached character reference. Keep character 100% identical.');
    I.push('');
    I.push('SUBJECT');
    I.push(karakter + ', shown ' + (sc === 1 ? 'facing camera, welcoming gesture' : sc % 2 === 0 ? '3/4 view, gesturing' : 'slightly to side, pointing'));
    I.push('');
    I.push('SCENE CONTENT');
    I.push('Illustrates: ' + judul);
    I.push('Include supporting visual element (diagram/object) beside character.');
    I.push('');
    I.push('STYLE');
    I.push('- ' + v.gaya);
    I.push('- ' + (sc === 1 ? 'Medium wide shot' : sc === n ? 'Medium shot, wider' : 'Medium shot, eye level'));
    I.push('- Soft cinematic lighting, clean background.');
    I.push('- Leave negative space for text.');
    I.push('- Ultra sharp, 8K.');
    I.push('');
    I.push('NEGATIVE: No text, no watermark, no extra limbs.');
    hasil.push({ title: 'Scene ' + sc + ' · 🖼️ Gambar — ' + judul, text: I.join('\n') });
    
    // Video prompt
    const V = P();
    V.push('SCENE ' + sc + ' — VIDEO PROMPT (for ' + v.target + ')');
    V.push('Aspect: ' + v.rasio + ' | Duration: ~' + Math.round((parseFloat(v.durasi) || 3) * 60 / n) + 's');
    V.push('');
    V.push('Animate from Scene ' + sc + ' still. Keep character identical.');
    V.push('');
    V.push('ACTION');
    V.push(karakter + ' ' + (sc === 1 ? 'looks at camera, smiles, begins speaking' : sc === n ? 'warm closing gesture, waves goodbye' : 'speaks naturally, gestures toward visual'));
    V.push('Natural lip movement, blinking, subtle body shift.');
    V.push('Visual element ' + (sc === 1 ? 'fades in' : 'animates softly'));
    V.push('');
    V.push('CAMERA');
    V.push('- ' + (sc === 1 ? 'Slow push-in' : sc === n ? 'Slow pull-back' : sc % 2 === 0 ? 'Slow pan right' : 'Static with subtle float'));
    V.push('- Consistent framing, single continuous take.');
    V.push('');
    V.push('STYLE');
    V.push('- ' + v.gaya);
    V.push('- Stable lighting, consistent color grading.');
    V.push('');
    V.push('NEGATIVE: No text, no cuts, no morphing, no extra characters.');
    hasil.push({ title: 'Scene ' + sc + ' · 🎬 Video — ' + judul, text: V.join('\n') });
  }
  
  return hasil;
}

// 9. UI FIELD BUILDER

function buatField(f, store) {
  if (f.t === 'sec') {
    const d = document.createElement('div');
    d.className = 'fsec';
    d.textContent = f.label;
    return d;
  }
  if (f.t === 'row' || f.t === 'row3') {
    const d = document.createElement('div');
    d.className = f.t;
    (f.kids || []).forEach(k => d.appendChild(buatField(k, store)));
    return d;
  }
  
  const wrap = document.createElement('div');
  wrap.className = 'field';
  
  if (f.t === 'switch') {
    wrap.className = '';
    const lab = document.createElement('label');
    lab.className = 'switch';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = !!f.on;
    const sp = document.createElement('span');
    sp.textContent = f.label;
    lab.appendChild(cb);
    lab.appendChild(sp);
    wrap.appendChild(lab);
    store[f.k] = () => cb.checked;
    if (store.__set) store.__set[f.k] = function(v) { if (typeof v === 'boolean') cb.checked = v; };
    return wrap;
  }
  
  const lab = document.createElement('label');
  lab.innerHTML = f.label;
  if (f.ide && IDE[f.ide]) {
    const bar = document.createElement('div');
    bar.className = 'lbl-row';
    const bi = document.createElement('button');
    bi.className = 'btn-ide';
    bi.type = 'button';
    bi.textContent = '💡 Ide dari AI';
    bar.appendChild(lab);
    bar.appendChild(bi);
    wrap.appendChild(bar);
    wrap._ideBtn = bi;
    wrap._ideFn = f.ide;
  } else {
    wrap.appendChild(lab);
  }
  
  if (f.t === 'chips') {
    const box = document.createElement('div');
    box.className = 'chips';
    (f.opts || []).forEach(([k, full]) => {
      const c = document.createElement('div');
      c.className = 'chip' + ((f.on || []).includes(k) ? ' on' : '');
      c.dataset.full = full;
      c.textContent = full.length > 46 ? full.slice(0, 44).replace(/\s\S*$/, '') + '…' : full;
      c.title = full;
      c.onclick = () => c.classList.toggle('on');
      box.appendChild(c);
    });
    wrap.appendChild(box);
    store[f.k] = () => [...box.querySelectorAll('.chip.on')].map(c => c.dataset.full);
    if (store.__set) store.__set[f.k] = function(v) {
      if (!Array.isArray(v)) return;
      box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', v.indexOf(c.dataset.full) > -1));
    };
    return wrap;
  }
  
  let el;
  if (f.t === 'select') {
    el = document.createElement('select');
    (f.opts || []).forEach(([val, txt]) => {
      const o = document.createElement('option');
      o.value = val;
      o.innerHTML = txt;
      el.appendChild(o);
    });
  } else if (f.t === 'textarea') {
    el = document.createElement('textarea');
    if (f.ph) el.placeholder = f.ph;
    if (f.h) el.style.minHeight = f.h + 'px';
  } else {
    el = document.createElement('input');
    if (f.t === 'mapel') el.setAttribute('list', 'mapelList');
    if (f.ph) el.placeholder = f.ph;
  }
  wrap.appendChild(el);
  store[f.k] = () => el.value.trim ? el.value.trim() : el.value;
  if (store.__set) store.__set[f.k] = function(v) { if (v != null) el.value = v; };
  
  if (wrap._ideBtn) {
    const fn = wrap._ideFn;
    wrap._ideBtn.onclick = function() {
      const g = function(k) { return store[k] ? store[k]() : ''; };
      el.value = IDE[fn](g);
      el.dispatchEvent(new Event('input'));
      wrap._ideBtn.textContent = '💡 Ide lain';
      toast('Ide terisi — silakan diedit', 'info', 1900);
      el.focus();
    };
  }
  return wrap;
}

function pasangTool(T) {
  const sec = document.createElement('section');
  sec.className = 'view';
  sec.id = 'v_' + T.id;
  
  // Topbar
  const top = document.createElement('div');
  top.className = 'topbar';
  top.innerHTML = '<div class="brand">SANGCREATOR</div><h1>' + T.judul + '</h1><p class="sub">' + T.sub + '</p>';
  sec.appendChild(top);
  
  const pill = document.createElement('div');
  pill.className = 'pill pill-free';
  pill.textContent = '✅ GRATIS';
  top.appendChild(pill);
  
  // Card
  const card = document.createElement('div');
  card.className = 'card';
  const h = document.createElement('h2');
  h.textContent = 'Isi Data';
  card.appendChild(h);
  
  const gen = document.createElement('button');
  gen.className = 'btn btn-main';
  gen.style.marginTop = '6px';
  gen.textContent = '✨ Buat Prompt';
  
  const store = {};
  store.__set = {};
  const KEY = 'sc_draft_' + T.id;
  let simpanTimer = null, tagDraft = null;
  store.__dirty = function() {
    if (simpanTimer) clearTimeout(simpanTimer);
    simpanTimer = setTimeout(function() {
      try {
        const d = {};
        Object.keys(store).forEach(function(k) {
          if (k.indexOf('__') === 0) return;
          d[k] = store[k]();
        });
        localStorage.setItem(KEY, JSON.stringify(d));
        if (tagDraft) {
          tagDraft.textContent = '✓ Draft tersimpan';
          tagDraft.classList.add('on');
          setTimeout(function() { tagDraft.classList.remove('on'); }, 1900);
        }
      } catch (e) {}
    }, 500);
  };
  
  let sudahBangun = false;
  sec._bangun = function() {
    if (sudahBangun) return;
    sudahBangun = true;
    const frag = document.createDocumentFragment();
    (T.fields || []).forEach(f => frag.appendChild(buatField(f, store)));
    card.insertBefore(frag, gen);
    tagDraft = document.createElement('div');
    tagDraft.className = 'draft-tag';
    card.insertBefore(tagDraft, gen);
    try {
      const d = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (d) Object.keys(d).forEach(function(k) { if (store.__set[k]) store.__set[k](d[k]); });
    } catch (e) {}
  };
  
  card.appendChild(gen);
  sec.appendChild(card);
  
  // Output
  const oh = document.createElement('div');
  oh.className = 'out-head';
  const h3 = document.createElement('h3');
  h3.textContent = 'Hasil Prompt';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = '0 prompt';
  const all = document.createElement('button');
  all.className = 'btn btn-ghost';
  all.style.padding = '7px 12px';
  all.textContent = '📋 Salin Semua';
  oh.appendChild(h3);
  oh.appendChild(badge);
  oh.appendChild(all);
  sec.appendChild(oh);
  
  const out = document.createElement('div');
  out.innerHTML = '<div class="card empty">Isi data di atas lalu tekan <b>Buat Prompt</b>.</div>';
  sec.appendChild(out);
  
  let hasil = [];
  gen.onclick = function() {
    gen.textContent = '⏳ Menyusun...';
    nanti(function() {
      const v = {};
      Object.keys(store).forEach(function(k) {
        if (k.indexOf('__') !== 0) v[k] = store[k]();
      });
      const r = T.build(v) || [];
      gen.textContent = '✨ Buat Prompt';
      
      // Semua tools gratis
      hasil = r;
      const frag = document.createDocumentFragment();
      hasil.forEach(b => frag.appendChild(blok(b.title, b.text)));
      out.innerHTML = '';
      out.appendChild(frag);
      badge.textContent = hasil.length + ' prompt';
      guliInstan(out);
      toast(hasil.length + ' prompt siap disalin', 'ok');
      store.__dirty();
    });
  };
  
  card.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      gen.click();
    }
  });
  
  all.onclick = function() {
    if (!hasil.length) {
      toast('Belum ada prompt. Tekan "Buat Prompt" dulu.', 'info');
      return;
    }
    salin(hasil.map(b => '===== ' + b.title + ' =====\n' + b.text).join('\n\n\n'), this);
  };
  
  document.getElementById('genericViews').appendChild(sec);
}

// Kelompokkan tools berdasarkan grup
const MENU_GRUP = {};
TOOLS.forEach(T => {
  if (!MENU_GRUP[T.grup]) MENU_GRUP[T.grup] = [];
  MENU_GRUP[T.grup].push(T);
});

const URUTAN_GRUP = ['MEDIA BELAJAR', 'PERENCANAAN', 'PENILAIAN', 'ADMINISTRASI', 'KOMUNIKASI'];
const MENU = URUTAN_GRUP.filter(g => MENU_GRUP[g]).map(g => ({
  grup: g,
  items: MENU_GRUP[g]
}));

const navBox = document.getElementById('navBox');
const POSISI = {};

MENU.forEach(g => {
  const l = document.createElement('div');
  l.className = 'nav-label';
  l.textContent = g.grup;
  navBox.appendChild(l);
  
  g.items.forEach(T => {
    const n = document.createElement('div');
    n.className = 'nav';
    if (T.id === 'ringkasan') n.classList.add('on');
    n.dataset.view = 'v_' + T.id;
    n.dataset.judul = T.judul;
    n.innerHTML = '<div class="ic">' + T.icon + '</div>' +
                  '<div class="tx"><b>' + T.nama + '</b><span>' + T.desc + '</span></div>' +
                  '<div class="badge-n badge-free">GRATIS</div>';
    n.onclick = function() {
      if (n.classList.contains('on')) { tutupSide(); return; }
      const lama = document.querySelector('.view.on');
      if (lama) POSISI[lama.id] = window.pageYOffset;
      document.querySelectorAll('.nav').forEach(x => x.classList.remove('on'));
      document.querySelectorAll('.view').forEach(x => x.classList.remove('on'));
      n.classList.add('on');
      const sec = document.getElementById(n.dataset.view);
      if (sec._bangun) sec._bangun();
      sec.classList.add('on');
      document.getElementById('mTitle').textContent = n.dataset.judul;
      tutupSide();
      window.scrollTo(0, POSISI[sec.id] || 0);
    };
    navBox.appendChild(n);
  });
});

function tutupSide() {
  document.getElementById('side').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}

    '<textarea class="f-sub" placeholder="satu baris satu poster"></textarea></div>' +
    '<div class="field"><label>Poin wajib <span style="font-weight:400;">(opsional)</span></label>' +
    '<input class="f-poin" placeholder="contoh: rumus V = I × R"></div>';
  
  el.querySelector('.del').onclick = () => { el.remove(); nomorUlang(); };
  const mp = el.querySelector('.f-mapel');
  const sb = el.querySelector('.f-sub');
  const lb = el.querySelector('.materi-label');
  const upd = () => {
    const m = mp.value.trim();
    const s = sb.value.split('\n').map(x => x.trim()).filter(Boolean);
    lb.textContent = m ? (m + (s.length ? ' · ' + s.length + ' poster' : '')) : 'Materi baru';
  };
  mp.oninput = upd;
  sb.oninput = upd;
  el.querySelector('.bi-sub').onclick = function() {
    const bab = el.querySelector('.f-bab').value.trim();
    if (!bab) { toast('Isi dulu Bab / Topik-nya.', 'info'); return; }
    sb.value = IDE.submateri(function(k) { return k === 'bab' ? bab : ''; });
    upd();
    this.textContent = '💡 Ide lain';
  };
  mp.value = data.mapel || '';
  el.querySelector('.f-kelas').value = data.kelas || '';
  el.querySelector('.f-bab').value = data.bab || '';
  sb.value = data.sub || '';
  upd();
  listBox.appendChild(el);
  nomorUlang();
  return el;
}

// Render ringkasan
function bacaDaftar() {
  return [...listBox.children].map(el => ({
    mapel: (el.querySelector('.f-mapel').value || '').trim(),
    kelas: (el.querySelector('.f-kelas').value || '-').trim(),
    bab: (el.querySelector('.f-bab').value || '-').trim(),
    poin: (el.querySelector('.f-poin').value || '').trim(),
    subs: el.querySelector('.f-sub').value.split('\n').map(s => s.trim()).filter(Boolean)
  })).filter(x => x.mapel && x.subs.length);
}

let semuaTeks = [];
let vi = 0;

function renderRingkasan() {
  const daftar = bacaDaftar();
  const out = document.getElementById('output');
  semuaTeks = [];
  
  if (!daftar.length) {
    out.innerHTML = '<div class="card empty">Minimal isi <b>Mata Pelajaran</b> dan <b>Submateri</b> pada satu kartu.</div>';
    document.getElementById('countBadge').textContent = '0 poster';
    return;
  }
  
  if (!document.getElementById('enBahasa').checked && !document.getElementById('enEnglish').checked) {
    out.innerHTML = '<div class="card empty">Aktifkan minimal satu versi prompt.</div>';
    return;
  }
  
  out.innerHTML = '';
  let total = 0;
  let seed = vi;
  
  daftar.forEach((item, idx) => {
    const gt = document.createElement('div');
    gt.className = 'group-title';
    gt.textContent = '▸ ' + item.mapel + ' — ' + item.bab + ' (' + item.kelas + ')';
    out.appendChild(gt);
    
    item.subs.forEach(sub => {
      total++;
      if (document.getElementById('enBahasa').checked) {
        const t = promptRingkasan(item, sub, seed++, idx);
        semuaTeks.push('===== ' + item.mapel + ' · ' + sub + ' =====\n' + t);
        out.appendChild(blok(item.mapel + ' · ' + sub, t));
      }
      if (document.getElementById('enEnglish').checked) {
        const t = promptEN(item, sub, idx);
        semuaTeks.push('===== EN · ' + item.mapel + ' · ' + sub + ' =====\n' + t);
        out.appendChild(blok('EN · ' + item.mapel + ' · ' + sub, t));
      }
    });
  });
  
  document.getElementById('countBadge').textContent = total + ' poster · ' + daftar.length + ' mapel';
  toast(total + ' prompt poster siap disalin', 'ok');
  guliInstan(out);
}

function promptEN(item, sub, idx) {
  const G = {
    gaya: document.getElementById('gaya')?.value || 'ilustrasi kartun edukatif',
    ukuran: document.getElementById('ukuran')?.value || 'A4 Portrait',
    maskot: document.getElementById('maskot')?.value || '',
    identitas: document.getElementById('identitas')?.value.trim() || ''
  };
  
  function warnaUntuk(mapel, idx) {
    const p = document.getElementById('warna')?.value || 'AUTO';
    if (p !== 'AUTO') return p;
    const key = mapel.toLowerCase().trim();
    if (WARNA_MAPEL[key]) return WARNA_MAPEL[key];
    return WARNA_CADANGAN[idx % WARNA_CADANGAN.length];
  }
  
  function pilihElemen() {
    return [...document.querySelectorAll('#chips .chip.on')].map(c => {
      const r = ELEMEN.find(e => e[0] === c.dataset.k);
      return r ? r[2] : '';
    }).filter(Boolean);
  }
  
  const L = [];
  L.push('Role: Instructional Graphic Designer and Learning Media Expert.');
  L.push('');
  L.push('Create an educational summary poster about "' + sub + '" (chapter: ' + item.bab + ', subject: ' + item.mapel + ', grade: ' + item.kelas + ').');
  L.push('Format: ' + G.ukuran + ', print-ready, 300 DPI.');
  L.push('Visual style: ' + G.gaya + '.');
  L.push('Color palette: ' + warnaUntuk(item.mapel, idx) + '.');
  if (G.maskot) L.push('Include ' + G.maskot + '.');
  L.push('Layout: clean grid, clear hierarchy, generous spacing.');
  L.push('Must include: ' + pilihElemen().join('; ') + '.');
  if (item.poin) L.push('Teacher notes: ' + item.poin + '.');
  if (G.identitas) L.push('Footer: "' + G.identitas + '".');
  L.push('IMPORTANT: all text in correct Indonesian, no typos.');
  return L.join('\n');
}

// ================================================================
// 16. API KEY INITIALIZATION
// ================================================================

async function initGeminiAPI() {
  const statusEl = document.getElementById('apiStatus');
  
  if (!GEMINI_API_KEY) {
    statusEl.className = 'api-status err';
    statusEl.innerHTML = '❌ <b>API Key belum diisi!</b><br><span style="font-size:10px;">Isi API Key Gemini di kolom bawah.</span>';
    return;
  }
  
  statusEl.className = 'api-status';
  statusEl.innerHTML = '🔄 Menguji koneksi ke Gemini API...';
  
  try {
    const testResponse = await fetch(GEMINI_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: 'Balas dengan "OK" saja.' }] }],
        generationConfig: { maxOutputTokens: 10 }
      })
    });
    
    if (!testResponse.ok) {
      const error = await testResponse.json();
      throw new Error(error.error?.message || 'API Key tidak valid.');
    }
    
    API_READY = true;
    statusEl.className = 'api-status ok';
    statusEl.innerHTML = '✅ <b>Gemini API siap digunakan</b><br><span class="key">Model: ' + GEMINI_MODEL + '</span>';
    document.getElementById('apiModel').textContent = GEMINI_MODEL + ' ✅';
    toast('Gemini API berhasil terhubung!', 'ok', 3000);
    
  } catch (error) {
    statusEl.className = 'api-status err';
    statusEl.innerHTML = '❌ <b>Gagal terhubung ke Gemini</b><br><span style="font-size:10px;">' + error.message + '</span>';
    toast('⚠️ ' + error.message, 'err', 5000);
    API_READY = false;
  }
}
